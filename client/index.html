<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="./index.css">
</head>
<body>
<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-2 sidebar d-flex flex-column align-items-start">
            <button onclick="showSection('books')"><i class="bi bi-book me-2"></i>الكتب</button>
            <button onclick="showSection('members')"><i class="bi bi-people me-2"></i>الأعضاء</button>
            <button onclick="showSection('borrowings')"><i class="bi bi-journal-arrow-down me-2"></i>الاستعارات</button>
        </div>

        <!-- Main Content -->
        <div class="col-10 p-4">
            <!-- Books Section -->
            <div id="books" class="content-section active">
                <h3 class="mb-4">📚 إدارة الكتب</h3>

                <div class="form-section mb-4">
                    <form id="bookForm" onsubmit="handleSubmit(event)">
                        <input type="hidden" id="bookId">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">العنوان</label>
                                <input type="text" id="title" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">المؤلف</label>
                                <input type="text" id="author" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">سنة النشر</label>
                                <input type="number" id="year" class="form-control">
                            </div>
                            <div class="col-12 text-end">
                                <button type="submit" class="btn btn-success mt-3">💾 حفظ</button>
                            </div>
                        </div>
                    </form>
                </div>

                <div class="table-responsive">
                    <table class="table table-bordered table-striped">
                        <thead class="table-light">
                            <tr>
                                <th>العنوان</th>
                                <th>المؤلف</th>
                                <th>سنة النشر</th>
                                <th>إجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="bookTable"></tbody>
                    </table>
                </div>
            </div>

            <!-- Members Section -->
            <div id="members" class="content-section">
                <h3 class="mb-4">👥 إدارة الأعضاء</h3>
                
                <!-- ✅ Form -->
                <div class="form-section mb-4">
                    <form id="memberForm" onsubmit="submitMember(event)">
                        <input type="hidden" id="memberId">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">الاسم الكامل</label>
                                <input type="text" id="fullName" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">نوع العضوية</label>
                                <select id="membershipType" class="form-select" required>
                                    <option value="">اختر...</option>
                                    <option value="student">طالب</option>
                                    <option value="teacher">معلم</option>
                                    <option value="staff">موظف</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">سنة الانضمام</label>
                                <input type="number" id="joinYear" class="form-control" required>
                            </div>
                            <div class="col-12 text-end">
                                <button type="submit" class="btn btn-success mt-3">💾 حفظ</button>
                            </div>
                        </div>
                    </form>
                </div>
                
                <!-- ✅ Table -->
                <div class="table-responsive">
                    <table class="table table-bordered table-striped">
                        <thead>
                            <tr>
                                <th>الاسم</th>
                                <th>نوع العضوية</th>
                                <th>سنة الانضمام</th>
                                <th>إجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="memberTable"></tbody>
                    </table>
                </div>

            </div>


            <!-- Borrowings Section -->
            <div id="borrowings" class="content-section">
                <h3 class="mb-4">📚 إدارة الاستعارات</h3>
            
                <!-- ✅ Form -->
                <div class="form-section mb-4">
                    <form id="borrowForm" onsubmit="submitBorrowing(event)">
                        <div class="row g-3">
                            <div class="col-md-5">
                                <label class="form-label">اختر العضو</label>
                                <select id="borrowMember" class="form-select" required></select>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label">اختر الكتاب</label>
                                <select id="borrowBook" class="form-select" required></select>
                            </div>
                            <div class="col-md-2 d-flex align-items-end">
                                <button type="submit" class="btn btn-primary w-100">➕ استعارة</button>
                            </div>
                        </div>

                    </form>
                </div>
                <!-- ✅ Table -->
                <div class="table-responsive">
                    <table class="table table-bordered table-striped">
                        <thead>
                            <tr>
                                <th>العضو</th>
                                <th>الكتاب</th>
                                <th>تاريخ الاستعارة</th>
                                <th>تاريخ الإرجاع</th>
                                <th>إجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="borrowTable"></tbody>
                    </table>
                </div>
            </div>

        </div>


<!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> -->
<script src="./index.js"></script>
</body>
</html>
